<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Wiedzy EKG</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --accent-help: #f59e0b;
            --accent-help-hover: #d97706;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #15803d;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #b91c1c;
            --section-bg: #e0f2fe;
            --section-text: #0369a1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 700;
        }

        .section-header {
            background-color: var(--section-bg);
            color: var(--section-text);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            margin: 30px 0 15px 0;
            border-left: 5px solid var(--primary-color);
        }

        .question-card {
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0 0 12px 0;
        }

        .option-item {
            margin-bottom: 8px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .option-label:hover {
            background-color: #f1f5f9;
            border-color: var(--primary-color);
        }

        .option-label input[type="radio"] {
            margin-top: 3px;
            margin-right: 12px;
            cursor: pointer;
        }

        /* Option Feedback Styles */
        .option-item.correct-answer .option-label {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-item.wrong-answer .option-label {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-text) !important;
        }

        .option-item.eliminated .option-label {
            opacity: 0.4;
            text-decoration: line-through;
            background-color: #f1f5f9;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .help-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .help-btn {
            background-color: var(--accent-help);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .help-btn:hover {
            background-color: var(--accent-help-hover);
        }

        .help-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .help-text {
            font-size: 0.85rem;
            color: #d97706;
            font-style: italic;
        }

        .feedback-box {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .feedback-box.correct {
            display: block;
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: var(--correct-text);
        }

        .feedback-box.incorrect {
            display: block;
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background-color: #f0f9ff;
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            text-align: center;
        }

        #result h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .score-details {
            font-size: 1.2rem;
            margin: 15px 0;
        }

        .score-highlight {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Test Wiedzy z EKG</h1>
    <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="calculateScore()">Zakończ test i zobacz pełny wynik</button>
    </form>

    <div id="result">
        <h2>Wynik Testu</h2>
        <div class="score-details">

        <p id="score-summary"></p>
        <button type="button" class="submit-btn" style="width: auto; margin: 15px auto 0;" onclick="location.reload()">Rozwiąż ponownie</button>
    </div>
</div>

// Flat list of all questions for logic processing
const allQuestions = [];
quizSections.forEach(section => {
    section.questions.forEach(q => allQuestions.push(q));
});

const helpUsed = {};
const answeredQuestions = {};

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizSections.forEach((section) => {
        const sectionHeader = document.createElement('div');
        sectionHeader.className = 'section-header';
        sectionHeader.textContent = section.title;
        container.appendChild(sectionHeader);

        section.questions.forEach((q) => {
            helpUsed[q.id] = false;
            answeredQuestions[q.id] = false;

            const shuffledOptions = shuffleArray(q.options);

            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${q.id}`;

            let optionsHTML = '';
            shuffledOptions.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li class="option-item" id="opt-item-${q.id}-${optIndex}">
                        <label class="option-label">
                            <input type="radio" name="q${q.id}" value="${opt.correct}" data-opt-id="${optIndex}" onchange="handleSelectOption(${q.id}, this)">
                            <span>${escapeHtml(opt.text)}</span>
                        </label>
                    </li>
                `;
            });

            const correctOpt = q.options.find(o => o.correct);

            card.innerHTML = `
                <div class="question-title">Pytanie ${q.id}. ${escapeHtml(q.question)}</div>
                <ul class="options-list" id="options-list-${q.id}">
                    ${optionsHTML}
                </ul>
                <div class="help-container">
                    <button type="button" class="help-btn" id="help-btn-${q.id}" onclick="useHelp(${q.id})">
                        💡 Pomóż (Odrzuć 1 błędną)
                    </button>
                    <span class="help-text" id="help-text-${q.id}"></span>
                </div>
                <div class="feedback-box" id="feedback-${q.id}">
                    <div id="feedback-msg-${q.id}"></div>
                    <div style="margin-top: 5px;"><strong>Prawidłowa odpowiedź:</strong> ${escapeHtml(correctOpt.text)}</div>
                </div>
            `;

            container.appendChild(card);
        });
    });
}

function handleSelectOption(questionId, inputElement) {
    answeredQuestions[questionId] = true;

    const isCorrect = inputElement.value === 'true';
    const list = document.getElementById(`options-list-${questionId}`);
    const items = list.querySelectorAll('.option-item');
    const feedbackBox = document.getElementById(`feedback-${questionId}`);
    const feedbackMsg = document.getElementById(`feedback-msg-${questionId}`);

    // Lock all inputs for this question to prevent changing answer
    items.forEach(item => {
        const inp = item.querySelector('input');
        inp.disabled = true;

        if (inp.value === 'true') {
            item.classList.add('correct-answer');
        }
    });

    if (!isCorrect) {
        const selectedItem = inputElement.closest('.option-item');
        selectedItem.classList.add('wrong-answer');
        feedbackBox.className = 'feedback-box incorrect';
        feedbackMsg.innerHTML = '❌ <strong>Nieprawidłowa odpowiedź!</strong>';
    } else {
        feedbackBox.className = 'feedback-box correct';
        feedbackMsg.innerHTML = '✅ <strong>Prawidłowa odpowiedź!</strong>';
    }

    // Disable help button after answering
    const helpBtn = document.getElementById(`help-btn-${questionId}`);
    if (helpBtn) helpBtn.disabled = true;
}

function useHelp(questionId) {
    if (helpUsed[questionId] || answeredQuestions[questionId]) return;

    const list = document.getElementById(`options-list-${questionId}`);
    const items = list.querySelectorAll('.option-item');
    const incorrectItems = [];

    items.forEach(item => {
        const input = item.querySelector('input');
        if (input.value === 'false' && !item.classList.contains('eliminated')) {
            incorrectItems.push(item);
        }
    });

    if (incorrectItems.length > 0) {
        const randomIncorrect = incorrectItems[Math.floor(Math.random() * incorrectItems.length)];
        randomIncorrect.classList.add('eliminated');
        const input = randomIncorrect.querySelector('input');
        input.disabled = true;

        helpUsed[questionId] = true;

        const btn = document.getElementById(`help-btn-${questionId}`);
        btn.disabled = true;

        const helpText = document.getElementById(`help-text-${questionId}`);
        helpText.textContent = "Użyto pomocy (-0.5 pkt w przypadku poprawnej odpowiedzi)";
    }
}

function calculateScore() {
    let totalScore = 0;
    const maxScore = allQuestions.length;
    let answeredCount = 0;

    allQuestions.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);

        if (selected) {
            answeredCount++;
            const isCorrect = selected.value === 'true';

            if (isCorrect) {
                if (helpUsed[q.id]) {
                    totalScore += 0.5;
                } else {
                    totalScore += 1.0;
                }
            }
        }
    });

    if (answeredCount < allQuestions.length) {
        if (!confirm(`Odpowiedziałeś na ${answeredCount} z ${allQuestions.length} pytań. Czy na pewno chcesz zakończyć?`)) {
            return;
        }
    }

    document.getElementById('score-val').textContent = totalScore;
    document.getElementById('max-score-val').textContent = maxScore;

    const percent = Math.round((totalScore / maxScore) * 100);
    document.getElementById('score-summary').textContent = `Twój wynik procentowy to: ${percent}%. Wszystkie pytania mają oznaczone prawidłowe odpowiedzi.`;

    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

window.onload = renderQuiz;
